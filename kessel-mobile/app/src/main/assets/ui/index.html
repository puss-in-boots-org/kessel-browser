<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Kessel</title>
  <link rel="stylesheet" href="app.css" />
</head>
<!-- Kessel for phones: the address bar, new tab page, tab switcher, menus
     and settings (app.js). A WebView of its own over the page: just the bar,
     or the whole screen while one of these is open (MainActivity.kt). -->
<body>
  <main id="stage">
    <section id="ntp" class="layer" hidden></section>
    <section id="suggest" class="layer" hidden><ol id="suggest-list"></ol></section>
    <section id="switcher" class="layer" hidden></section>
    <section id="panel" class="layer" hidden></section>
  </main>

  <div id="scrim" hidden></div>
  <div id="sheet" hidden></div>

  <footer id="bar">
    <div id="progress"><div id="progress-fill"></div></div>
    <form id="bar-main" autocomplete="off">
      <button type="button" id="site-btn" class="icon-btn" aria-label="This site"></button>
      <div id="address">
        <span id="address-text"></span>
        <input id="address-input" type="text" inputmode="url" enterkeyhint="go" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="Search or type an address" hidden />
      </div>
      <button type="button" id="clear-btn" class="icon-btn" aria-label="Clear" hidden></button>
      <button type="button" id="tabs-btn" class="icon-btn" aria-label="Tabs"><span id="tab-count">1</span></button>
      <button type="button" id="menu-btn" class="icon-btn" aria-label="Menu"></button>
    </form>
    <form id="find-bar" autocomplete="off" hidden>
      <input id="find-input" type="search" enterkeyhint="search" placeholder="Find in page" spellcheck="false" />
      <span id="find-count"></span>
      <button type="button" id="find-prev" class="icon-btn" aria-label="Previous"></button>
      <button type="button" id="find-next" class="icon-btn" aria-label="Next"></button>
      <button type="button" id="find-close" class="icon-btn" aria-label="Close"></button>
    </form>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
