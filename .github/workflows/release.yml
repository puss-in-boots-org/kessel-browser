# Publishes a Kessel release: when a version tag is pushed (git tag v0.9.0
# && git push origin v0.9.0), or from the Actions tab (Run workflow, with the
# version), which tags the commit it runs on:
#
# - the Windows installers, built here as in build.yml;
# - Kessel for phones' Android installers (kessel-mobile/), which follow
#   the desktop's version (tauri-browser/package.json);
# - SHA256SUMS.txt, and the notes in .github/release-notes/<tag>.md (its
#   first line, "# Title", is the release's title).
#
# The Android installers are signed with the KESSEL_KEYSTORE_BASE64,
# KESSEL_KEYSTORE_PASSWORD, KESSEL_KEY_ALIAS and KESSEL_KEY_PASSWORD secrets
# when they're set, else with a throw-away debug key (see
# kessel-mobile/README.md).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, e.g. 0.9.0 (tauri-browser/package.json must say the same); v<version> is tagged on this commit"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        name: The tag matches the app's version and has notes
        run: |
          version=$(node -p "require('./tauri-browser/package.json').version")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Releasing $TAG, but tauri-browser/package.json says $version"
            exit 1
          fi
          if [ ! -f ".github/release-notes/$TAG.md" ]; then
            echo "::error::No .github/release-notes/$TAG.md"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tauri-browser
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-browser/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-browser/src-tauri -> target

      - name: Install frontend tooling
        run: npm ci

      - name: Build installers
        run: npx tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            tauri-browser/src-tauri/target/release/bundle/nsis/*.exe
            tauri-browser/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch the Shields filter lists
        run: node scripts/fetch-mobile-shields.mjs

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KESSEL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kessel.jks"
            echo "KESSEL_KEYSTORE_FILE=$RUNNER_TEMP/kessel.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KESSEL_KEYSTORE_BASE64 secret: the Android installers are signed with a debug key"
          fi

      - name: Build the installers
        working-directory: kessel-mobile
        env:
          KESSEL_KEYSTORE_PASSWORD: ${{ secrets.KESSEL_KEYSTORE_PASSWORD }}
          KESSEL_KEY_ALIAS: ${{ secrets.KESSEL_KEY_ALIAS }}
          KESSEL_KEY_PASSWORD: ${{ secrets.KESSEL_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease bundleRelease
          version="${{ needs.check.outputs.version }}"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Kessel_${version}_android.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/Kessel_${version}_android.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$TAG.md"
          title=$(head -n 1 "$notes" | sed 's/^# *//')
          tail -n +2 "$notes" > "$RUNNER_TEMP/notes.md"
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -la
          # A pushed tag is used as it is; from the Actions tab, the tag is
          # made on the commit this run built.
          gh release create "$TAG" * --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
