# Builds Kessel's Windows installers on GitHub's runners.
#
# Why CI and not locally: with Smart App Control on, Windows blocks cargo's
# freshly compiled build scripts ("An Application Control policy has
# blocked this file", os error 4551), so Kessel can't be compiled on a
# SAC-protected PC at all -- and an unsigned kessel.exe built anywhere won't
# run on one either. The installers only run on SAC machines once they're
# code-signed with a certificate from a trusted CA (signing step: TODO,
# pending the choice of signing provider).

name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight build -- private
# repos pay for Windows runner minutes at 2x.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tauri-browser
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri-browser/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-browser/src-tauri -> target

      - name: Install frontend tooling
        run: npm ci

      - name: Build installers
        run: npx tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: kessel-windows-${{ github.sha }}
          path: |
            tauri-browser/src-tauri/target/release/bundle/nsis/*.exe
            tauri-browser/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
