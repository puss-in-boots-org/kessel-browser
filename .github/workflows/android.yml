# Builds Kessel for phones (kessel-mobile/): the Android installers -- an
# APK to install directly and an App Bundle (AAB) for Google Play -- on
# GitHub's Linux runners, which come with the Android SDK.
#
# Signing: with the repository secrets KESSEL_KEYSTORE_BASE64 (a base64'd
# .jks), KESSEL_KEYSTORE_PASSWORD, KESSEL_KEY_ALIAS and KESSEL_KEY_PASSWORD
# the release is signed with that key. Without them it's signed with a
# throw-away debug key: it installs fine, but a later build signed with the
# real key can't update it (uninstall first).

name: Android

on:
  push:
    paths:
      - "kessel-mobile/**"
      - "tauri-browser/src/shared/answers.js"
      - "tauri-browser/src/shared/icons.js"
      - "tauri-browser/src/shared/api.js"
      - "tauri-browser/package.json"
      - "scripts/fetch-mobile-shields.mjs"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "kessel-mobile/**"
      - "tauri-browser/src/shared/answers.js"
      - "tauri-browser/src/shared/icons.js"
      - "tauri-browser/src/shared/api.js"
      - "tauri-browser/package.json"
      - "scripts/fetch-mobile-shields.mjs"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the phone UI's logic
        run: node --test "kessel-mobile/tests/*.test.mjs" "tauri-browser/tests/unit/answers.test.mjs"

      - name: Fetch the Shields filter lists
        run: node scripts/fetch-mobile-shields.mjs

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KESSEL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kessel.jks"
            echo "KESSEL_KEYSTORE_FILE=$RUNNER_TEMP/kessel.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::No KESSEL_KEYSTORE_BASE64 secret: the release is signed with a debug key"
          fi

      - name: Unit tests
        working-directory: kessel-mobile
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build the installers
        working-directory: kessel-mobile
        env:
          KESSEL_KEYSTORE_PASSWORD: ${{ secrets.KESSEL_KEYSTORE_PASSWORD }}
          KESSEL_KEY_ALIAS: ${{ secrets.KESSEL_KEY_ALIAS }}
          KESSEL_KEY_PASSWORD: ${{ secrets.KESSEL_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease bundleRelease
          version=$(node -p "require('../tauri-browser/package.json').version")
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Kessel-$version.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/Kessel-$version.aab"
          ls -la ../dist

      - uses: actions/upload-artifact@v7
        with:
          name: kessel-android-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: kessel-android-reports-${{ github.sha }}
          path: kessel-mobile/app/build/reports/
          retention-days: 7
