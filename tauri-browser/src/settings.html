<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Settings</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    body { display: flex; height: 100vh; overflow: hidden; }

    #settings-nav {
      width: 210px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 18px 10px;
      overflow-y: auto;
    }
    #settings-nav h1 { font-size: 16px; margin: 6px 10px 18px; font-weight: 700; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 12.5px;
      color: var(--text-dim);
      cursor: pointer;
      transition: background var(--dur-fast) ease, color var(--dur-fast) ease;
    }
    .nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .nav-item.active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }

    #settings-content { flex: 1; overflow-y: auto; padding: 34px 40px 80px; }
    .panel { max-width: 640px; margin: 0 auto 64px; display: none; animation: fadeUp var(--dur-slow) var(--ease); }
    .panel.active { display: block; }
    .panel h2 { font-size: 19px; margin: 0 0 6px; }
    .panel > .sub { color: var(--text-faint); font-size: 12.5px; margin: 0 0 24px; }

    /* This page can now also be shown in the ~260-560px side panel, not
       just a full tab -- collapse the side nav into a horizontal strip on
       top rather than a fixed 210px column that would eat most of it. */
    @media (max-width: 620px) {
      body { flex-direction: column; }
      #settings-nav {
        width: 100%;
        height: auto;
        display: flex;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: visible;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 10px;
        gap: 2px;
      }
      #settings-nav h1 { display: none; }
      .nav-item { flex-shrink: 0; white-space: nowrap; }
      #settings-content { padding: 20px 18px 60px; }
    }

    .setting-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 18px;
    }
    .setting-row + .setting-row { border-top: 1px solid var(--border); }
    .setting-row .info { min-width: 0; }
    .setting-row .info .title { font-size: 13px; font-weight: 500; }
    .setting-row .info .desc { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
    .setting-row .control { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }

    .theme-options { display: flex; gap: 10px; padding: 16px 18px; }
    .theme-swatch {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      transition: border-color var(--dur-fast) ease, transform var(--dur-fast) ease;
    }
    .theme-swatch:hover { transform: translateY(-1px); }
    .theme-swatch.selected { border-color: var(--accent); }
    .theme-preview { height: 34px; border-radius: 7px; margin-bottom: 8px; }
    .theme-preview.dark { background: linear-gradient(135deg, #16171d, #0b0c10); }
    .theme-preview.light { background: linear-gradient(135deg, #ffffff, #eceef4); border: 1px solid #ddd; }
    .theme-preview.custom { background: conic-gradient(from 180deg, #7c5cff, #6bd2ff, #ff5c9a, #7c5cff); }

    .accent-row { display: flex; align-items: center; gap: 8px; padding: 16px 18px; flex-wrap: wrap; }
    .accent-swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform var(--dur-fast) ease, border-color var(--dur-fast) ease;
    }
    .accent-swatch:hover { transform: scale(1.12); }
    .accent-swatch.selected { border-color: var(--text); }
    input[type=color].accent-custom { width: 26px; height: 26px; border: none; border-radius: 50%; padding: 0; overflow: hidden; cursor: pointer; background: none; }

    .list-panel { padding: 6px; max-height: 280px; overflow-y: auto; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; }
    .list-row:hover { background: var(--surface-hover); }
    .list-row .lr-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .list-row .lr-sub { color: var(--text-faint); font-size: 11px; }

    .add-row { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); }

    input[type=range] { width: 140px; accent-color: var(--accent); }
  </style>
</head>
<body>
  <nav id="settings-nav">
    <h1>Settings</h1>
    <div id="nav-items"></div>
  </nav>
  <div id="settings-content"></div>

  <script type="module" src="settings.js"></script>
</body>
</html>
