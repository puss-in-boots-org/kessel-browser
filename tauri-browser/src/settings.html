<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Settings</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    body { display: flex; height: 100vh; overflow: hidden; }

    #settings-nav {
      width: 210px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 18px 10px;
      overflow-y: auto;
    }
    #settings-nav h1 { font-size: 16px; margin: 6px 10px 18px; font-weight: 700; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 12.5px;
      color: var(--text-dim);
      cursor: pointer;
      transition: background var(--dur-fast) ease, color var(--dur-fast) ease;
    }
    .nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .nav-item.active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }

    #settings-content { flex: 1; overflow-y: auto; padding: 34px 40px 80px; }
    .panel { max-width: 640px; margin: 0 auto 64px; display: none; animation: fadeUp var(--dur-slow) var(--ease); }
    .panel.active { display: block; }
    .panel h2 { font-size: 19px; margin: 0 0 6px; }
    .panel > .sub { color: var(--text-faint); font-size: 12.5px; margin: 0 0 24px; }

    /* This page can now also be shown in the ~260-560px side panel, not
       just a full tab -- collapse the side nav into a horizontal strip on
       top rather than a fixed 210px column that would eat most of it. */
    @media (max-width: 620px) {
      body { flex-direction: column; }
      #settings-nav {
        width: 100%;
        height: auto;
        display: flex;
        flex-direction: row;
        overflow-x: auto;
        overflow-y: visible;
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 10px;
        gap: 2px;
      }
      #settings-nav h1 { display: none; }
      .nav-item { flex-shrink: 0; white-space: nowrap; }
      #settings-content { padding: 20px 18px 60px; }
    }

    .setting-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 18px;
    }
    .setting-row + .setting-row { border-top: 1px solid var(--border); }
    .setting-row .info { min-width: 0; }
    .setting-row .info .title { font-size: 13px; font-weight: 500; }
    .setting-row .info .desc { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
    .setting-row .control { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }

    .theme-options { display: flex; gap: 10px; padding: 16px 18px; }
    .theme-swatch {
      flex: 1;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      text-align: center;
      font-size: 12px;
      transition: border-color var(--dur-fast) ease, transform var(--dur-fast) ease;
    }
    .theme-swatch:hover { transform: translateY(-1px); }
    .theme-swatch.selected { border-color: var(--accent); }
    .theme-preview { height: 34px; border-radius: 7px; margin-bottom: 8px; }
    .theme-preview.dark { background: linear-gradient(135deg, #16171d, #0b0c10); }
    .theme-preview.light { background: linear-gradient(135deg, #ffffff, #eceef4); border: 1px solid #ddd; }
    .theme-preview.custom { background: conic-gradient(from 180deg, #7c5cff, #6bd2ff, #ff5c9a, #7c5cff); }

    .accent-row { display: flex; align-items: center; gap: 8px; padding: 16px 18px; flex-wrap: wrap; }
    .accent-swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform var(--dur-fast) ease, border-color var(--dur-fast) ease;
    }
    .accent-swatch:hover { transform: scale(1.12); }
    .accent-swatch.selected { border-color: var(--text); }
    input[type=color].accent-custom { width: 26px; height: 26px; border: none; border-radius: 50%; padding: 0; overflow: hidden; cursor: pointer; background: none; }

    .list-panel { padding: 6px; max-height: 280px; overflow-y: auto; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; }
    .list-row:hover { background: var(--surface-hover); }
    .list-row .lr-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
    .list-row .lr-sub { color: var(--text-faint); font-size: 11px; }

    .add-row { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); }

    input[type=range] { width: 140px; accent-color: var(--accent); }

    .wallpaper-row { display: flex; align-items: center; gap: 10px; padding: 4px 18px 16px; flex-wrap: wrap; }
    .wallpaper-swatch { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim); cursor: pointer; }
    .wp-preview {
      width: 74px;
      height: 48px;
      border-radius: 12px;
      border: 2px solid transparent;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      background-size: cover !important;
      transition: transform var(--dur-fast) ease, border-color var(--dur-fast) ease;
    }
    .wp-preview.custom { display: flex; align-items: center; justify-content: center; background: var(--surface-2); color: var(--text-faint); border: 2px dashed var(--border); }
    .wallpaper-swatch:hover .wp-preview { transform: translateY(-1px); }
    .wallpaper-swatch.selected .wp-preview { border: 2px solid var(--accent); }
    .wallpaper-swatch.selected { color: var(--text); }

    /* Keyboard & Mouse */
    .shortcut-category { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); padding: 14px 18px 4px; border-top: 1px solid var(--border); }
    .shortcut-category[hidden], .shortcut-row[hidden] { display: none; }
    .shortcut-row { padding-top: 9px; padding-bottom: 9px; }
    .setting-row.shortcut-row + .setting-row.shortcut-row { border-top: none; }
    .shortcut-keys { flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .key-chip { display: inline-flex; align-items: center; gap: 2px; padding: 3px 4px 3px 8px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; }
    .key-chip.recording { padding: 4px 10px; border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); animation: pulse 1.2s ease-in-out infinite; }
    .key-chip.recording small { color: var(--text-faint); margin-left: 6px; }
    .chip-x { display: inline-flex; border: none; background: none; padding: 3px; border-radius: 5px; cursor: pointer; color: var(--text-faint); }
    .chip-x:hover { color: var(--danger); background: var(--surface-hover); }
    kbd { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); border-bottom-width: 2px; background: var(--surface); font-family: inherit; font-size: 11.5px; font-weight: 600; text-align: center; }
    .kbd-plus { color: var(--text-faint); margin: 0 2px; font-size: 11px; }
    .always-tag { font-size: 10px; font-weight: 600; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 999px; padding: 0 6px; margin-left: 4px; vertical-align: 1px; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); } }

    .about-value { max-width: 360px; overflow-wrap: anywhere; text-align: right; font-size: 12.5px; }

    /* Clear browsing data */
    .clear-modal { padding: 20px 22px; width: min(480px, 94vw); }
    .clear-modal h3 { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; font-size: 16px; }
    .clear-range { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; font-weight: 500; margin-bottom: 12px; }
    .clear-range select { width: 170px; }
    .clear-kinds { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .clear-kind { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; cursor: pointer; }
    .clear-kind + .clear-kind { border-top: 1px solid var(--border); }
    .clear-kind:hover { background: var(--surface-hover); }
    .clear-kind input { margin-top: 2px; accent-color: var(--accent); width: 16px; height: 16px; flex-shrink: 0; }
    .clear-kind b { display: block; font-size: 13px; font-weight: 500; }
    .clear-kind small { display: block; font-size: 11.5px; color: var(--text-faint); margin-top: 2px; line-height: 1.4; }
    .clear-note { color: var(--danger); font-size: 12px; min-height: 16px; margin: 10px 0 0; }
    .clear-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .clear-actions .spinner { width: 13px; height: 13px; border-width: 2px; }

    /* Tabs and Performance: two-way choices, saved groups, site lists. */
    .segmented { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
    .segmented button { border: none; background: transparent; color: var(--text-dim); font: inherit; font-size: 12.5px; padding: 6px 14px; border-radius: 7px; cursor: pointer; }
    .segmented button.active { background: var(--accent); color: #fff; }
    .saved-group-row .title { display: flex; align-items: center; gap: 8px; }
    .group-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .site-list { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 14px; }
    .site-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; }
    .site-chip button { border: none; background: transparent; color: var(--text-faint); cursor: pointer; display: flex; padding: 2px; border-radius: 50%; }
    .site-chip button:hover { color: var(--danger); background: var(--surface-hover); }
  </style>
</head>
<body>
  <nav id="settings-nav">
    <h1>Settings</h1>
    <div id="nav-items"></div>
  </nav>
  <div id="settings-content"></div>

  <script type="module" src="settings.js"></script>
</body>
</html>
