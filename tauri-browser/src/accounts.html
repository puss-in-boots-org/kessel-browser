<!DOCTYPE html>
<html lang="en" data-glass-role="page">
<head>
  <meta charset="UTF-8" />
  <title>Accounts</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/glass.css" />
  <style>
    /* The account menu: a small webview Rust places under the address bar's
       avatar (see toggle_accounts_popup in main.rs). */
    html, body { height: 100%; overflow: hidden; user-select: none; }
    body { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
    html.glass body { background: #0a1433; border: none; }
    #wallpaper { display: none; }
    html.glass #wallpaper { display: block; position: fixed; inset: -40px; filter: blur(28px) saturate(1.6); pointer-events: none; }
    html.glass #sheet {
      position: fixed;
      inset: 0;
      background: var(--lg-gloss), color-mix(in srgb, var(--lg-menu-bg) 85%, transparent);
      box-shadow: var(--lg-edge);
    }
    main {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 14px 10px 10px;
      color: var(--text);
    }
    html.glass main { color: var(--lg-text); }

    .head { padding: 0 6px 10px; }
    .head .title { font-size: 14px; font-weight: 700; }
    .head .sub { font-size: 11.5px; opacity: 0.65; margin-top: 2px; line-height: 1.35; }

    #list { flex: 1; overflow-y: auto; scrollbar-width: thin; display: flex; flex-direction: column; gap: 2px; }

    .acct {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 6px 7px 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: background var(--dur-fast) ease;
    }
    .acct:hover { background: var(--surface-hover); }
    html.glass .acct:hover { background: rgba(255, 255, 255, 0.12); }
    html.glass[data-glass-tone="light"] .acct:hover { background: rgba(255, 255, 255, 0.45); }
    .acct .text { flex: 1; min-width: 0; }
    .acct .name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .acct .hint { font-size: 11px; opacity: 0.6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .acct .here {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: 6px;
      color: var(--acct, var(--accent));
      background: color-mix(in srgb, var(--acct, var(--accent)) 16%, transparent);
    }
    html.glass .acct .here { color: var(--lg-text); background: rgba(255, 255, 255, 0.16); }

    .icon-btn {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 9px;
      background: none;
      color: inherit;
      opacity: 0.6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity var(--dur-fast) ease, background var(--dur-fast) ease;
    }
    .icon-btn:hover { opacity: 1; background: var(--surface-hover); }
    html.glass .icon-btn:hover { background: rgba(255, 255, 255, 0.16); }

    /* Inline forms: add / rename / confirm delete. */
    .form {
      padding: 8px;
      margin: 2px 0;
      border-radius: 12px;
      background: var(--surface-2);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    html.glass .form { background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.18); }
    .form input {
      width: 100%;
      box-sizing: border-box;
      height: 30px;
      padding: 0 10px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .form input:focus { border-color: var(--accent); }
    html.glass .form input { background: rgba(0, 0, 0, 0.18); border-color: rgba(255, 255, 255, 0.2); color: var(--lg-text); }
    html.glass[data-glass-tone="light"] .form input { background: rgba(255, 255, 255, 0.6); }
    .form .msg { font-size: 12px; line-height: 1.4; }
    .form .err { font-size: 11.5px; color: var(--danger); }
    .form .row { display: flex; gap: 6px; justify-content: flex-end; }
    .form button {
      height: 28px;
      padding: 0 12px;
      border-radius: 9px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      background: var(--surface-hover);
    }
    .form button.primary { background: var(--accent); color: #fff; }
    .form button.danger { background: var(--danger); color: #fff; }
    .form button.link { background: none; color: var(--danger); margin-right: auto; padding: 0 4px; }
    html.glass .form button:not(.primary):not(.danger):not(.link) { background: rgba(255, 255, 255, 0.16); color: var(--lg-text); }

    .add {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      padding: 8px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.85;
    }
    .add:hover { opacity: 1; background: var(--surface-hover); }
    html.glass .add:hover { background: rgba(255, 255, 255, 0.12); }
    .add .plus {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px dashed currentColor;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="wallpaper" data-wallpaper></div>
  <div id="sheet"></div>
  <main>
    <div class="head">
      <div class="title">Accounts</div>
      <div class="sub">Each account has its own sign-ins. Its tabs are grouped in its colour.</div>
    </div>
    <div id="list"></div>
    <div id="footer"></div>
  </main>
  <script type="module" src="accounts.js"></script>
</body>
</html>
