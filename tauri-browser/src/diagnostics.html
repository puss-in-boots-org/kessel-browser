<!DOCTYPE html>
<html lang="en" data-page="diagnostics">
<head>
  <meta charset="UTF-8" />
  <title>Diagnostics</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    /* kessel://diagnostics (diagnostics.js): Kessel, this PC, the network,
       storage, crash reports and which web features work -- for a bug
       report, or to see what's going on. kessel://gpu has graphics and media. */
    body { height: 100vh; overflow-y: auto; margin: 0; }
    .content { max-width: 860px; margin: 0 auto; padding: 30px 40px 120px; }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
    header h1 { font-size: 21px; margin: 0; flex: 1; display: flex; align-items: center; gap: 10px; }
    header h1 svg { color: var(--accent); }
    .sub { color: var(--text-faint); font-size: 12.5px; margin: 0 0 18px; line-height: 1.5; }
    .notice { display: flex; gap: 10px; align-items: center; padding: 11px 14px; border-radius: 11px; margin: 0 0 18px; font-size: 12.5px; background: color-mix(in srgb, var(--warning) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warning) 40%, transparent); }
    .notice span { flex: 1; }
    .notice[hidden] { display: none; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin: 26px 0 8px; display: flex; align-items: center; gap: 8px; }
    h2 .grow { flex: 1; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .row { display: grid; grid-template-columns: 210px 1fr auto; gap: 14px; align-items: center; padding: 9px 14px; font-size: 12.5px; border-top: 1px solid var(--border); }
    .row:first-child { border-top: none; }
    .row .label { color: var(--text-dim); }
    .row .value { user-select: text; overflow-wrap: anywhere; }
    .row .value small { display: block; color: var(--text-faint); font-size: 11px; margin-top: 2px; }
    .state { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .state.ok { color: #2fbf71; background: color-mix(in srgb, #2fbf71 14%, transparent); }
    .state.warn { color: #e9a23b; background: color-mix(in srgb, #e9a23b 14%, transparent); }
    .state.off { color: var(--text-faint); background: var(--surface-hover); }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th { text-align: left; font-weight: 600; color: var(--text-faint); font-size: 11px; padding: 8px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 8px 14px; border-top: 1px solid var(--border); vertical-align: top; user-select: text; overflow-wrap: anywhere; }
    tr:first-child td { border-top: none; }
    td small { display: block; color: var(--text-faint); font-size: 11px; margin-top: 2px; }
    .empty { padding: 14px; color: var(--text-faint); font-size: 12.5px; }
    .links { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="content">
    <header>
      <h1><span id="logo"></span>Diagnostics</h1>
      <button class="btn sm" id="tasks-btn"></button>
      <button class="btn sm" id="gpu-btn"></button>
      <button class="btn sm" id="copy-btn"></button>
    </header>
    <p class="sub">What Kessel runs on and how it's doing: for a bug report, or to find out why something misbehaves. Nothing here leaves your PC unless you copy it.</p>
    <div class="notice" id="safe-mode" hidden></div>
    <div id="sections"></div>
  </div>
  <script type="module" src="diagnostics.js"></script>
</body>
</html>
