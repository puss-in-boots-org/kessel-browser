<!DOCTYPE html>
<html lang="en" data-glass-role="page">
<head>
  <meta charset="UTF-8" />
  <title>Suggestions</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/glass.css" />
  <style>
    /* The address bar's suggestions: a popup webview under it (see
       suggest_popup in main.rs). The address bar keeps the keyboard and
       sends what to show (see omnibox.js). */
    html, body { height: 100%; overflow: hidden; user-select: none; background: transparent; }
    body { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
    html.glass body { background: #0a1433; border: none; }
    #wallpaper { display: none; }
    html.glass #wallpaper { display: block; position: fixed; inset: -40px; filter: blur(28px) saturate(1.6); pointer-events: none; }
    html.glass #sheet { position: fixed; inset: 0; background: var(--lg-gloss), color-mix(in srgb, var(--lg-menu-bg) 90%, transparent); box-shadow: var(--lg-edge); }
    main { position: relative; height: 100%; overflow: hidden; padding: 5px; color: var(--text); }
    html.glass main { color: var(--lg-text); }

    .row {
      display: flex;
      align-items: center;
      gap: 11px;
      height: 34px;
      padding: 0 10px;
      border-radius: 9px;
      font-size: 13px;
      cursor: default;
    }
    .row.answer { height: 52px; }
    .row.selected { background: color-mix(in srgb, var(--accent) 16%, transparent); }
    html.glass .row.selected { background: rgba(255, 255, 255, 0.16); }
    .row:not(.selected):hover { background: var(--surface-hover); }
    html.glass .row:not(.selected):hover { background: rgba(255, 255, 255, 0.09); }

    .ico { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; opacity: 0.8; }
    .ico .app-icon { width: 18px; height: 18px; font-size: 9px; }
    .row.answer .ico { width: 30px; height: 30px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); opacity: 1; }
    html.glass .row.answer .ico { background: rgba(255, 255, 255, 0.14); color: inherit; }
    .swatch { width: 30px; height: 30px; border-radius: 9px; box-shadow: inset 0 0 0 1px rgba(128, 128, 128, 0.4); }

    .text { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px; white-space: nowrap; overflow: hidden; }
    .row.answer .text { flex-direction: column; align-items: flex-start; gap: 1px; }
    .title { overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0; }
    .title b { font-weight: 700; }
    .row.answer .title { font-size: 16px; font-weight: 600; max-width: 100%; }
    .detail { color: var(--text-faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; flex-shrink: 10; min-width: 0; }
    html.glass .detail { color: var(--lg-text-faint); }
    .row.answer .detail { max-width: 100%; }
    .detail.url { color: color-mix(in srgb, var(--accent) 80%, var(--text)); }
    html.glass .detail.url { color: #9ecbff; }

    .tail { display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 11px; opacity: 0.7; }
    .pill { padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; font-size: 10.5px; opacity: 0.85; }
    kbd { font-family: inherit; font-size: 10.5px; padding: 1px 5px; border-radius: 4px; border: 1px solid color-mix(in srgb, currentColor 35%, transparent); }
    .remove { display: none; border: none; background: none; color: inherit; padding: 4px; border-radius: 6px; cursor: pointer; }
    .row:hover .remove, .row.selected .remove { display: flex; }
    .remove:hover { background: rgba(128, 128, 128, 0.25); }
  </style>
</head>
<body>
  <div id="wallpaper" data-wallpaper></div>
  <div id="sheet"></div>
  <main id="list" role="listbox" aria-label="Suggestions"></main>
  <script type="module" src="suggest.js"></script>
</body>
</html>
