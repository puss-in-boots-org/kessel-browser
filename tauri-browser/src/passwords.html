<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Passwords</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    body { min-height: 100vh; }

    /* --- Lock / setup screen --- */
    #lock-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 24px;
    }
    #lock-card {
      width: min(380px, 92vw);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 30px 28px;
      box-shadow: var(--shadow);
      animation: popIn var(--dur-slow) var(--ease);
    }
    #lock-icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #6bd2ff));
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      margin: 0 auto 18px;
      box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 40%, transparent);
    }
    #lock-card h1 { font-size: 17px; text-align: center; margin: 0 0 4px; }
    #lock-card .sub { text-align: center; color: var(--text-faint); font-size: 12px; margin: 0 0 22px; }
    #lock-card .field { margin-bottom: 10px; }
    #lock-error { color: var(--danger); font-size: 12px; text-align: center; min-height: 16px; margin-bottom: 6px; }
    .strength-bar { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; margin: -3px 0 12px; }
    .strength-bar > div { height: 100%; width: 0%; background: var(--danger); transition: width var(--dur) var(--ease), background var(--dur) var(--ease); }

    /* --- Vault dashboard --- */
    #vault-shell { display: none; height: 100vh; flex-direction: column; }
    #vault-topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #vault-topbar h1 { font-size: 16px; margin: 0; flex: 1; }
    #vault-search { width: 220px; min-width: 0; flex-shrink: 1; }
    #vault-body { flex: 1; overflow-y: auto; padding: 20px 24px 60px; }
    #vault-list { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

    /* This page can also be shown in the ~260-560px side panel, not just a
       full tab -- let the inline password preview shrink/hide rather than
       forcing a fixed width that would overflow a narrow panel. */
    @media (max-width: 460px) {
      #vault-topbar h1 { display: none; }
      #vault-search { width: auto; flex: 1; }
      .item-pass { display: none; }
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color var(--dur-fast) ease;
      animation: fadeUp var(--dur) var(--ease);
    }
    .item-row:hover { border-color: var(--text-faint); }
    .item-avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
    }
    .item-info { min-width: 0; flex: 1; }
    .item-site { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-user { font-size: 11.5px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item-pass { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; width: 130px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; }
    .item-actions { display: flex; gap: 4px; flex-shrink: 0; }

    #vault-fab {
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 45%, transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform var(--dur-fast) var(--ease);
    }
    #vault-fab:hover { transform: scale(1.06); }
    #vault-fab:active { transform: scale(0.95); }

    .pw-field-wrap { position: relative; }
    .pw-field-wrap .field { padding-right: 74px; }
    .pw-field-actions { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: flex; gap: 2px; }

    #settings-mini { display: flex; gap: 6px; }
    .qr-secret {
      font-family: ui-monospace, monospace;
      font-size: 13px;
      letter-spacing: 1.5px;
      word-break: break-all;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      text-align: center;
      margin: 10px 0;
    }
    .modal-body { padding: 20px 22px; }
    .modal-head { padding: 18px 22px 0; }
    .modal-head h3 { margin: 0; font-size: 15px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 22px 22px; }
  </style>
</head>
<body>
  <div id="lock-screen">
    <div id="lock-card">
      <div id="lock-icon-wrap"></div>
      <h1 id="lock-title">Unlock your vault</h1>
      <div class="sub" id="lock-sub">Enter your master password to continue.</div>
      <div id="lock-error"></div>
      <div id="lock-form"></div>
    </div>
  </div>

  <div id="vault-shell">
    <div id="vault-topbar">
      <h1>Passwords</h1>
      <input class="field" id="vault-search" placeholder="Search" />
      <div id="settings-mini">
        <button class="btn ghost icon-only" id="vault-settings-btn" title="Vault settings"></button>
        <button class="btn ghost icon-only" id="vault-lock-btn" title="Lock vault"></button>
      </div>
    </div>
    <div id="vault-body">
      <div id="vault-list"></div>
    </div>
    <button id="vault-fab" title="Add password"></button>
  </div>

  <div class="modal-backdrop" id="item-modal-backdrop">
    <div class="modal" id="item-modal">
      <div class="modal-head"><h3 id="item-modal-title">Add password</h3></div>
      <div class="modal-body" id="item-modal-body"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="item-cancel-btn">Cancel</button>
        <button class="btn danger" id="item-delete-btn" style="display:none;margin-right:auto">Delete</button>
        <button class="btn primary" id="item-save-btn">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="vault-settings-backdrop">
    <div class="modal" id="vault-settings-modal">
      <div class="modal-head"><h3>Vault settings</h3></div>
      <div class="modal-body" id="vault-settings-body"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="vault-settings-close">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="passwords.js"></script>
</body>
</html>
