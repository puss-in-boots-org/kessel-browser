<!DOCTYPE html>
<html lang="en" data-glass-role="page">
<head>
  <meta charset="UTF-8" />
  <title>New Tab</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/glass.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8vh 24px 48px;
      overflow-y: auto;
      position: relative;
      scrollbar-width: thin;
    }
    /* Never squash the search bar/panels when the window is short -- scroll instead. */
    body > * { flex-shrink: 0; }

    /* Liquid Glass: the wallpaper is drawn as if across the whole window
       (glass.js alignToChrome shifts it by the toolbar's insets), so it
       continues seamlessly out of the toolbar's copy above/left of us. */
    #wallpaper { display: none; }
    html.glass #wallpaper { display: block; position: fixed; z-index: -1; pointer-events: none; }
    html.glass body { background: transparent; }
    html.glass { background: #0a1433; }

    #date {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.01em;
      animation: fadeUp 0.4s var(--ease);
    }
    #clock {
      font-size: 84px;
      font-weight: 250;
      line-height: 1;
      letter-spacing: -0.02em;
      margin: 4px 0 32px;
      font-variant-numeric: tabular-nums;
      animation: fadeUp 0.4s var(--ease);
    }
    html.glass :is(#date, #clock) { color: var(--lg-text); text-shadow: 0 2px 18px rgba(0, 0, 0, 0.25); }
    html.glass #date { color: var(--lg-text-dim); }

    #omnibox-wrap {
      width: min(600px, 88vw);
      height: 52px;
      margin-bottom: 40px;
      position: relative;
      display: flex;
      align-items: center;
      border-radius: 26px;
      background: var(--surface);
      border: 1px solid var(--border);
      transition: box-shadow var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    html.glass #omnibox-wrap { border: none; background: var(--lg-gloss), var(--lg-tint); }
    #omnibox-wrap:focus-within { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
    html.glass #omnibox-wrap:focus-within {
      background: var(--lg-gloss), var(--lg-tint-strong);
      box-shadow: var(--lg-edge), 0 0 0 4px color-mix(in srgb, var(--accent) 45%, transparent), var(--lg-shadow);
    }
    #omnibox-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; display: flex; }
    html.glass #omnibox-icon { color: var(--lg-text-dim); }
    #omnibox {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: inherit;
      padding: 0 22px 0 50px;
      font-size: 15px;
      background: transparent;
      color: var(--text);
      outline: none;
    }
    html.glass #omnibox { color: var(--lg-text); text-shadow: var(--lg-legibility); }
    html.glass #omnibox::placeholder { color: var(--lg-text-faint); }

    /* --- Speed dial panels: iOS home-screen style app icons --- */
    .section {
      width: min(760px, 92vw);
      margin-bottom: 18px;
      padding: 16px 18px 12px;
      border-radius: 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      animation: fadeUp 0.45s var(--ease) both;
    }
    .section:nth-of-type(2) { animation-delay: 0.05s; }
    html.glass .section { border: none; }
    .section h2 {
      font-size: 12px;
      letter-spacing: 0.02em;
      color: var(--text-faint);
      margin: 0 4px 10px;
      font-weight: 600;
    }
    html.glass .section h2 { color: var(--lg-text-dim); text-shadow: var(--lg-legibility); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 4px 6px;
    }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 10px 4px 8px;
      border-radius: 20px;
      cursor: pointer;
      text-align: center;
      transition: background var(--dur) var(--ease);
    }
    .tile:hover { background: var(--surface-hover); }
    html.glass .tile:hover { background: rgba(255, 255, 255, 0.1); }
    .tile .app-icon {
      width: 60px;
      height: 60px;
      font-size: 24px;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.3));
      transition: transform 0.3s var(--ease);
    }
    .tile:hover .app-icon { transform: translateY(-2px) scale(1.06); }
    .tile:active .app-icon { transform: scale(0.94); }
    .tile .tile-label {
      font-size: 12px;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-dim);
    }
    html.glass .tile .tile-label { color: var(--lg-text); text-shadow: var(--lg-legibility); }

    /* The "add" tile: a frosted squircle with a plus, like an empty dock slot */
    .add-glyph {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      border: 1.5px dashed var(--border);
      color: var(--text-faint);
      transition: transform 0.3s var(--ease);
    }
    html.glass .add-glyph {
      border: none;
      background: var(--lg-gloss), var(--lg-tint);
      box-shadow: var(--lg-edge);
      color: var(--lg-text-dim);
    }
    .tile:hover .add-glyph { transform: translateY(-2px) scale(1.06); }
    .grid .empty { grid-column: 1 / -1; padding: 14px 8px; }
    html.glass .grid .empty { color: var(--lg-text-dim); text-shadow: var(--lg-legibility); }
  </style>
</head>
<body>
  <div id="wallpaper" data-wallpaper></div>

  <div id="date"></div>
  <div id="clock">--:--</div>

  <div id="omnibox-wrap" class="lg">
    <span id="omnibox-icon"></span>
    <input id="omnibox" type="text" placeholder="Search or enter address" autofocus autocomplete="off" spellcheck="false" />
  </div>

  <div class="section lg">
    <h2>Speed Dial</h2>
    <div class="grid" id="pinned-grid"></div>
  </div>

  <div class="section lg">
    <h2>Bookmarks</h2>
    <div class="grid" id="bookmarks-grid"></div>
  </div>

  <script type="module" src="newtab.js"></script>
</body>
</html>
