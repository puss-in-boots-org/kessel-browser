<!DOCTYPE html>
<html lang="en" data-page="toolbar">
<head>
  <meta charset="UTF-8" />
  <title>Kessel</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="shared/glass.css" />
</head>
<body>
  <!-- Liquid Glass backdrop: the same wallpaper the new-tab page paints,
       aligned so the two read as one continuous background. -->
  <div id="wallpaper" data-wallpaper></div>

  <div id="app">
    <!-- Slim icon-only rail (Opera-GX style): clicking an icon slides a
         panel out beside the active tab rather than opening a new tab. -->
    <div id="rail">
      <div id="rail-capsule">
        <button class="rail-logo" id="rail-home" title="Home / New tab (Ctrl+T)"></button>

        <!-- Workspaces (once you have more than one): the one this window
             shows is marked; a click switches (see switchWorkspace). -->
        <div id="rail-workspaces" hidden></div>

        <div id="pinned-list"></div>
        <button class="rail-btn ghost-btn" id="rail-add-pin" title="Pin the current page"></button>

        <div class="rail-spacer"></div>

        <!-- The side panel's own pages and the AI assistant, as picked in
             Settings -> Side panel (sidebar.html). -->
        <div id="rail-panels"></div>

        <button class="rail-btn" id="rail-shield" title="Ad &amp; tracker blocking">
          <span class="rail-badge" id="shield-badge" hidden>0</span>
        </button>
        <button class="rail-btn" id="rail-downloads" title="Downloads">
          <span class="rail-badge" id="downloads-badge" hidden>0</span>
        </button>
        <button class="rail-btn" id="rail-passwords" title="Passwords (Ctrl+Shift+L)"></button>
        <button class="rail-btn" id="rail-settings" title="Settings"></button>
      </div>
    </div>

    <!-- Vertical tabs (Settings -> Tabs): the tab strip, its tab search and
         new-tab buttons move in here (see applyTabLayout in main.js). -->
    <div id="vtabs" hidden>
      <div id="vtabs-head">
        <button id="vtabs-collapse"></button>
      </div>
      <div id="vtabs-list"></div>
      <div id="vtabs-foot"></div>
      <div id="vtabs-resize" title="Drag to make the tabs wider or narrower"></div>
    </div>

    <div id="main-col">
      <div id="progress-bar"><div id="progress-fill"></div></div>

      <!-- Also the window's title bar (the window is frameless): empty
           space here drags the window, double-click maximizes. -->
      <div id="tab-bar">
        <div id="private-badge" hidden title="Private window: pages you visit aren't kept in history, and sign-ins and cookies are forgotten when the last private window closes."></div>
        <div id="profile-badge" hidden></div>
        <div id="window-name" hidden></div>
        <button id="tabs-scroll-left" class="strip-scroll" title="Scroll the tabs left" hidden></button>
        <div id="tabs"></div>
        <button id="tabs-scroll-right" class="strip-scroll" title="Scroll the tabs right" hidden></button>
        <button id="new-tab-btn" title="New tab (Ctrl+T)"></button>
        <button id="tab-search-btn" title="Search tabs (Ctrl+Shift+A)"></button>
        <div id="drag-space"></div>
        <div id="window-controls">
          <button id="win-min" title="Minimize"></button>
          <button id="win-max" title="Maximize"></button>
          <button id="win-close" title="Close"></button>
        </div>
      </div>

      <div id="nav-bar">
        <div id="nav-cluster">
          <button id="back-btn" title="Back (Alt+Left)"></button>
          <button id="forward-btn" title="Forward (Alt+Right)"></button>
          <button id="reload-btn" title="Reload (Ctrl+R)"></button>
          <button id="home-btn" title="Home page (Alt+Home)"></button>
        </div>

        <div id="address-wrap">
          <button id="lock-icon"></button>
          <input id="url-input" type="text" placeholder="Search or enter address" spellcheck="false" autocomplete="off" />
          <button id="zoom-btn" hidden></button>
          <!-- A pop-up or a redirect your site settings stopped on this
               page: open it anyway, or allow the site. -->
          <button id="blocked-btn" hidden></button>
          <!-- The page stopped responding (crash.rs): wait, or close it. -->
          <button id="hang-btn" hidden></button>
          <!-- The page is in another language than yours: translate it. -->
          <button id="translate-btn" hidden></button>
          <button id="engine-btn" title="Search engine"></button>
          <button id="shields-btn" title="Shields"><span id="shields-count" hidden></span></button>
          <button id="share-btn" title="Share this page: copy the link, QR code, send it" hidden></button>
          <!-- On an extension's page in the Chrome Web Store or Edge
               Add-ons: installs it here. -->
          <button id="store-add-btn" title="Add this extension to Kessel" hidden></button>
          <!-- Your extensions: their popups (extensions.html). -->
          <button id="ext-btn" title="Extensions" hidden></button>
          <button id="star-btn" title="Bookmark this page (Ctrl+D)"></button>
          <!-- Which account this tab is signed in as; opens the account
               menu (accounts.html). -->
          <button id="account-btn" title="Accounts"></button>
        </div>

        <div id="menu-cluster">
          <!-- Shown once a tab in this window has played sound: what's
               playing, with its controls (media.html). -->
          <button id="media-btn" title="Media controls" hidden></button>
          <!-- Kessel-wide news (crash.rs): safe mode, tabs to bring back
               after a crash, a graphics card that keeps failing. -->
          <button id="notice-btn" hidden></button>
          <button id="menu-btn" title="Kessel menu (Alt+F)"></button>
        </div>
      </div>

      <div id="bookmarks-bar"></div>
    </div>
  </div>

  <!-- Split view (main.js / split.rs): the divider in the gap between the
       two pages, and while a tab is held at a page edge, where it will go. -->
  <div id="split-divider" hidden><span class="split-grip"></span><button class="split-swap" title="Swap sides">&#8644;</button><button class="split-close" title="Exit split view">&#215;</button></div>
  <div id="split-hint" hidden><div class="split-hint-card"><span class="split-hint-title"></span><small>Drop to open side by side</small></div></div>
  <!-- Where something dragged onto the tab strip will land. -->
  <div id="drop-marker" hidden></div>

  <script type="module" src="main.js"></script>
</body>
</html>
