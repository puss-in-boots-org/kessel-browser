<!DOCTYPE html>
<html lang="en" data-glass-role="page">
<head>
  <meta charset="UTF-8" />
  <title>Save password</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/glass.css" />
  <style>
    /* "Save password for example.com?" after you sign in (passwords.rs). */
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--surface); border: var(--k-border-w, 1px) var(--k-border-style, solid) var(--border); border-radius: var(--k-popup-radius, 14px); }
    html.glass body { background: #0a1433; border: none; }
    main { position: relative; height: 100%; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; color: var(--text); box-sizing: border-box; }
    html.glass main { color: var(--lg-text); }
    .head { display: flex; gap: 10px; align-items: center; }
    .glyph { flex-shrink: 0; width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); }
    h1 { font-size: 13px; margin: 0; font-weight: 600; line-height: 1.35; word-break: break-all; }
    label { font-size: 11.5px; opacity: 0.7; }
    .field { width: 100%; box-sizing: border-box; }
    #note { font-size: 11.5px; opacity: 0.7; line-height: 1.4; }
    #error { font-size: 11.5px; color: var(--danger); min-height: 0; }
    .actions { display: flex; gap: 6px; justify-content: flex-end; margin-top: auto; }
    .actions .spacer { flex: 1; }
  </style>
</head>
<body>
  <main>
    <div class="head"><div class="glyph" id="glyph"></div><h1 id="title"></h1></div>
    <div><label for="user">User name</label><input class="field" id="user" spellcheck="false" /></div>
    <div id="unlock-row" hidden><label for="master">Master password -- to unlock your passwords</label><input class="field" type="password" id="master" /></div>
    <div id="note" hidden></div>
    <div id="error"></div>
    <div class="actions">
      <button class="btn sm ghost" id="never">Never for this site</button>
      <span class="spacer"></span>
      <button class="btn sm" id="later">Not now</button>
      <button class="btn primary sm" id="save">Save</button>
    </div>
  </main>
  <script type="module" src="password-offer.js"></script>
</body>
</html>
