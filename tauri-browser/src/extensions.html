<!DOCTYPE html>
<html lang="en" data-page="popup">
<head>
  <meta charset="UTF-8" />
  <title>Extensions</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
    header h1 { flex: 1; margin: 0; font-size: 13.5px; font-weight: 650; }
    #content { flex: 1; overflow-y: auto; padding: 0 8px 10px; }
    .ext {
      display: flex; align-items: center; gap: 10px;
      padding: 8px; border-radius: 9px; cursor: pointer;
    }
    .ext:hover { background: var(--surface-hover); }
    .ext img, .ext .glyph { width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0; object-fit: contain; }
    .ext .glyph { background: var(--surface-2); color: var(--text-dim); display: flex; align-items: center; justify-content: center; }
    .ext .text { flex: 1; min-width: 0; }
    .ext .name { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ext .sub { font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ext button {
      width: 26px; height: 26px; border: 0; border-radius: 7px; background: transparent;
      color: var(--text-dim); cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .ext button:hover { background: var(--surface-2); color: var(--text); }
    footer { display: flex; gap: 6px; padding: 8px 12px 12px; border-top: 1px solid var(--border); }
    footer .btn { flex: 1; justify-content: center; }

    /* Adding one */
    .install { padding: 4px 8px 0; }
    .install .top { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    .install .top img, .install .top .glyph { width: 44px; height: 44px; border-radius: 10px; object-fit: contain; flex-shrink: 0; }
    .install .top .glyph { background: var(--surface-2); display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
    .install h2 { margin: 0 0 2px; font-size: 14px; }
    .install .meta { font-size: 11.5px; color: var(--text-faint); }
    .install .desc { font-size: 12px; color: var(--text-dim); line-height: 1.45; margin: 0 0 12px; }
    .install .asks { font-size: 12px; font-weight: 650; margin: 0 0 6px; }
    .install ul { margin: 0 0 12px; padding-left: 18px; font-size: 12px; line-height: 1.55; color: var(--text); }
    .install .note { font-size: 11.5px; color: var(--text-faint); line-height: 1.45; margin-bottom: 10px; }
    .waiting { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 12px; color: var(--text-dim); font-size: 12.5px; text-align: center; }
    .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid var(--border); border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <header><h1 id="heading">Extensions</h1></header>
  <div id="content"></div>
  <footer id="footer"></footer>
  <script type="module" src="extensions.js"></script>
</body>
</html>
