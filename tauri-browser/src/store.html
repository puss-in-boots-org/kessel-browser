<!DOCTYPE html>
<html lang="en" data-page="store">
<head>
  <meta charset="UTF-8" />
  <title>Kessel Store</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    /* kessel://store (store.js): Kessel's own place to get extensions --
       picks that suit Kessel, anything else from the Chrome Web Store by
       its link, and the ones you have. */
    body { height: 100vh; overflow-y: auto; margin: 0; }
    .content { max-width: 1040px; margin: 0 auto; padding: 28px 40px 120px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 4px; flex-wrap: wrap; }
    header h1 { font-size: 22px; margin: 0; flex: 1; display: flex; align-items: center; gap: 10px; }
    header h1 svg { color: var(--accent); }
    .sub { color: var(--text-faint); font-size: 12.5px; margin: 0 0 18px; line-height: 1.5; max-width: 680px; }
    .search { position: relative; margin-bottom: 14px; }
    .search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
    .search input { width: 100%; box-sizing: border-box; padding: 12px 14px 12px 42px; font-size: 14px; border-radius: var(--radius); }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
    .tabs .chip { cursor: pointer; border: 1px solid var(--border); padding: 5px 12px; }
    .tabs .chip.active { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .tabs .grow { flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
    .item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; transition: border-color var(--dur) var(--ease); }
    .item:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
    .item .top { display: flex; gap: 12px; align-items: flex-start; }
    .avatar { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; color: #fff; overflow: hidden; }
    .avatar img { width: 40px; height: 40px; }
    .item .name { font-weight: 600; font-size: 14px; }
    .item .blurb { color: var(--text-dim); font-size: 12.5px; line-height: 1.45; margin-top: 2px; }
    .item .note { color: var(--text-faint); font-size: 11.5px; line-height: 1.4; }
    .item .bottom { display: flex; align-items: center; gap: 8px; margin-top: auto; }
    .item .bottom .grow { flex: 1; }
    .fit { font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .fit.good { color: var(--success); background: color-mix(in srgb, var(--success) 14%, transparent); }
    .fit.limited { color: var(--warning); background: color-mix(in srgb, var(--warning) 14%, transparent); }
    .fit.engine { color: var(--text-dim); background: var(--surface-hover); }
    .empty { padding: 26px; color: var(--text-faint); font-size: 13px; text-align: center; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--radius); }
    .link-card { display: flex; gap: 14px; align-items: center; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
    .link-card .grow { flex: 1; font-size: 13px; }
    .link-card small { display: block; color: var(--text-faint); margin-top: 2px; }
    .more { margin-top: 26px; display: flex; gap: 10px; align-items: center; color: var(--text-faint); font-size: 12.5px; flex-wrap: wrap; }
    /* The look-it-over sheet before an extension is added. */
    .sheet-back { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.45); display: flex; align-items: center; justify-content: center; z-index: 20; animation: fade var(--dur) var(--ease); }
    .sheet { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); width: min(460px, calc(100vw - 32px)); padding: 20px 22px; }
    .sheet h3 { margin: 0 0 4px; font-size: 16px; display: flex; gap: 10px; align-items: center; }
    .sheet .ver { color: var(--text-faint); font-size: 12px; font-weight: 400; }
    .sheet ul { margin: 12px 0 0; padding-left: 18px; color: var(--text-dim); font-size: 13px; line-height: 1.6; }
    .sheet .warn { color: var(--danger); font-size: 13px; margin-top: 10px; }
    .sheet .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 640px) { .content { padding: 20px 16px 80px; } }
  </style>
</head>
<body>
  <div class="content">
    <header>
      <h1 id="title"></h1>
      <button class="btn sm" id="manage"></button>
    </header>
    <p class="sub">Extensions picked to suit Kessel, run by Kessel's own extension runtime -- not by the Edge engine. Paste any Chrome Web Store link in the search box to add something that isn't listed.</p>

    <div class="search"><span id="search-icon"></span><input class="field" id="q" placeholder="Search the store, or paste a Chrome Web Store link" spellcheck="false" autocomplete="off" /></div>
    <div id="link"></div>
    <div class="tabs" id="tabs"></div>
    <div class="grid" id="grid"></div>

    <div class="more">
      <span>Looking for something else?</span>
      <button class="btn sm ghost" id="cws"></button>
      <button class="btn sm ghost" id="file"></button>
    </div>
  </div>
  <script type="module" src="store.js"></script>
</body>
</html>
