<!DOCTYPE html>
<html lang="en" data-page="lock">
<head>
  <meta charset="UTF-8" />
  <title>Kessel is locked</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    /* Over the whole window while Kessel is locked (browser_lock.rs): your
       PIN or password, or Windows Hello. */
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: var(--bg); user-select: none; }
    main { width: 320px; text-align: center; }
    #symbol { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;
      color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
    h1 { font-size: 21px; margin: 0 0 6px; }
    p { font-size: 13px; color: var(--text-dim); margin: 0 0 20px; }
    form { display: flex; gap: 8px; }
    #secret { flex: 1; text-align: center; font-size: 16px; letter-spacing: 0.12em; }
    #error { min-height: 18px; margin: 12px 0 0; font-size: 12.5px; color: var(--danger); }
    #hello { margin-top: 14px; }
    #hello[hidden] { display: none; }
    .shake { animation: shake 0.3s; }
    @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    @media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div id="symbol"></div>
    <h1>Kessel is locked</h1>
    <p id="what">&nbsp;</p>
    <form id="form" autocomplete="off">
      <input class="field" id="secret" type="password" spellcheck="false" autocomplete="off" aria-label="PIN or password" />
      <button class="btn primary" id="unlock" type="submit">Unlock</button>
    </form>
    <div id="error" role="alert"></div>
    <button class="btn" id="hello" type="button" hidden></button>
  </main>
  <script type="module" src="lock.js"></script>
</body>
</html>
