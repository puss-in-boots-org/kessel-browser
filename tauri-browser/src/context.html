<!DOCTYPE html>
<html lang="en" data-glass-role="page">
<head>
  <meta charset="UTF-8" />
  <title>Menu</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/glass.css" />
  <style>
    /* A right-click menu (tabs, tab groups...): a popup webview at the click
       point (see toggle_popup in main.rs), so it shows over the page -- a
       menu drawn inside the toolbar would be hidden behind the tab below. */
    html, body { height: 100%; overflow: hidden; user-select: none; }
    body { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    html.glass body { background: #0a1433; border: none; }
    #wallpaper { display: none; }
    html.glass #wallpaper { display: block; position: fixed; inset: -40px; filter: blur(28px) saturate(1.6); pointer-events: none; }
    html.glass #sheet { position: fixed; inset: 0; background: var(--lg-gloss), color-mix(in srgb, var(--lg-menu-bg) 88%, transparent); box-shadow: var(--lg-edge); }
    main { position: relative; height: 100%; overflow-y: auto; padding: 5px; color: var(--text); scrollbar-width: thin; }
    html.glass main { color: var(--lg-text); }
    .item { display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; cursor: default; outline: none; }
    .item svg { flex-shrink: 0; opacity: 0.85; }
    .item .label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item .keys { font-size: 11px; opacity: 0.55; white-space: nowrap; }
    .item .check { width: 14px; flex-shrink: 0; display: flex; }
    .item:hover, .item.focused { background: var(--surface-hover); }
    html.glass .item:hover, html.glass .item.focused { background: rgba(255, 255, 255, 0.12); }
    .item.danger { color: var(--danger); }
    .item.disabled { opacity: 0.4; pointer-events: none; }
    .sep { height: 1px; margin: 5px 8px; background: var(--border); }
    html.glass .sep { background: rgba(255, 255, 255, 0.14); }
    .header { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.5; padding: 6px 10px 3px; }
    .swatch { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35); }
  </style>
</head>
<body>
  <div id="wallpaper" data-wallpaper></div>
  <div id="sheet"></div>
  <main id="menu" role="menu"></main>
  <script type="module" src="context.js"></script>
</body>
</html>
