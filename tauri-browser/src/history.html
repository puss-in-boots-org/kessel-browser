<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>History</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    body { display: flex; height: 100vh; overflow: hidden; }

    #side {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    #side h1 { font-size: 16px; margin: 6px 10px 18px; font-weight: 700; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 12.5px;
      color: var(--text-dim);
      cursor: pointer;
      border: none;
      background: none;
      text-align: left;
      width: 100%;
    }
    .nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .nav-item.active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
    .side-foot { margin-top: auto; padding: 10px 6px 0; display: flex; flex-direction: column; gap: 8px; }
    .side-foot .keep { font-size: 11px; color: var(--text-faint); padding: 0 4px; line-height: 1.45; }
    .side-foot .keep a { cursor: pointer; }

    main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    header { padding: 22px 32px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--border); }
    .search { position: relative; max-width: 640px; }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
    .search .field { padding-left: 38px; }
    .ranges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .ranges .chip { cursor: pointer; border: 1px solid var(--border); }
    .ranges .chip:hover { color: var(--text); }
    .ranges .chip.active { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
    .ranges input[type=date] { border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; color: var(--text-dim); color-scheme: dark; }
    :root[data-theme="light"] .ranges input[type=date] { color-scheme: light; }

    #bars { padding: 0 32px; }
    .bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      background: color-mix(in srgb, var(--accent) 12%, var(--surface));
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
    }
    .bar[hidden] { display: none; }
    .bar .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    #scroller { flex: 1; overflow-y: auto; padding: 8px 32px 60px; }
    #list { max-width: 900px; }
    .day { font-size: 12px; font-weight: 600; color: var(--text-dim); margin: 18px 0 6px; padding: 0 10px; position: sticky; top: -8px; background: var(--bg); padding-top: 8px; padding-bottom: 6px; z-index: 1; }
    .visit {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 10px;
      border-radius: 9px;
      font-size: 13px;
      min-height: 38px;
    }
    .visit:hover { background: var(--surface-hover); }
    .visit.selected { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .visit input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; cursor: pointer; flex-shrink: 0; opacity: 0.35; }
    .visit:hover input[type=checkbox], .visit.selected input[type=checkbox], body.selecting .visit input[type=checkbox] { opacity: 1; }
    .visit .time { font-size: 11.5px; color: var(--text-faint); width: 44px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .visit .app-icon { width: 20px; height: 20px; font-size: 10px; }
    .visit .title { color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 0 1 auto; }
    .visit .title:hover { text-decoration: underline; }
    .visit .host { color: var(--text-faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 60px; }
    .visit .count { color: var(--text-faint); font-size: 12px; white-space: nowrap; }
    .visit .row-btn { opacity: 0; flex-shrink: 0; }
    .visit:hover .row-btn, .visit .row-btn:focus-visible { opacity: 1; }
    .visit .row-btn.always { opacity: 1; }

    .menu {
      position: fixed;
      min-width: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 5px;
      z-index: 50;
      animation: popIn var(--dur) var(--ease);
    }
    .menu button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      border: none;
      background: none;
      border-radius: 8px;
      font-size: 12.5px;
      cursor: pointer;
      text-align: left;
    }
    .menu button:hover, .menu button:focus-visible { background: var(--surface-hover); outline: none; }
    .menu button.danger { color: var(--danger); }
    .menu hr { border: none; border-top: 1px solid var(--border); margin: 4px 2px; }

    #more { display: flex; justify-content: center; padding: 18px; }
    #more[hidden] { display: none; }
    .empty-state { text-align: center; color: var(--text-faint); padding: 70px 20px; font-size: 13px; }
    .empty-state svg { display: block; margin: 0 auto 12px; opacity: 0.6; }

    .section-title { font-size: 12px; font-weight: 600; color: var(--text-dim); margin: 22px 10px 6px; text-transform: uppercase; letter-spacing: 0.04em; }

    @media (max-width: 720px) {
      body { flex-direction: column; }
      #side { width: 100%; flex-direction: row; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 8px; }
      #side h1, .side-foot .keep { display: none; }
      .nav-item { width: auto; flex-shrink: 0; white-space: nowrap; }
      .side-foot { margin: 0 0 0 auto; padding: 0; flex-direction: row; }
      header, #bars, #scroller { padding-left: 14px; padding-right: 14px; }
      .visit .host { display: none; }
    }
  </style>
</head>
<body>
  <aside id="side">
    <h1>History</h1>
    <button class="nav-item active" data-view="all"></button>
    <button class="nav-item" data-view="sites"></button>
    <button class="nav-item" data-view="searches"></button>
    <button class="nav-item" data-view="closed"></button>
    <div class="side-foot">
      <button class="btn sm" id="clear-data-btn">Clear browsing data…</button>
      <div class="keep" id="keep-note"></div>
    </div>
  </aside>
  <main>
    <header>
      <div class="search">
        <span id="search-icon"></span>
        <input class="field" id="q" type="search" placeholder="Search history" spellcheck="false" autocomplete="off" />
      </div>
      <div class="ranges" id="ranges">
        <span class="chip active" data-range="any">Any time</span>
        <span class="chip" data-range="today">Today</span>
        <span class="chip" data-range="yesterday">Yesterday</span>
        <span class="chip" data-range="week">Last 7 days</span>
        <span class="chip" data-range="month">Last 30 days</span>
        <input type="date" id="day-picker" title="Visits on one day" />
      </div>
    </header>
    <div id="bars">
      <div class="bar" id="selection-bar" hidden>
        <span class="grow" id="selection-count"></span>
        <button class="btn ghost sm" id="select-all-btn">Select all shown</button>
        <button class="btn danger sm" id="delete-selected-btn">Delete</button>
        <button class="btn ghost sm" id="cancel-selection-btn">Cancel</button>
      </div>
      <div class="bar" id="site-bar" hidden>
        <span class="grow" id="site-bar-text"></span>
        <button class="btn danger sm" id="delete-site-btn">Delete all from this site</button>
        <button class="btn ghost sm" id="clear-site-btn">Show all sites</button>
      </div>
    </div>
    <div id="scroller">
      <section id="list"></section>
      <div id="more" hidden><div class="spinner"></div></div>
    </div>
  </main>

  <script type="module" src="history.js"></script>
</body>
</html>
