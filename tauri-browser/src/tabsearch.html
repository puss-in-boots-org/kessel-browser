<!DOCTYPE html>
<html lang="en" data-glass-role="page">
<head>
  <meta charset="UTF-8" />
  <title>Search tabs</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="shared/glass.css" />
  <style>
    /* Tab search (Ctrl+Shift+A, or the button beside the tabs): every tab
       of every window and the recently closed ones, filtered as you type. */
    html, body { height: 100%; overflow: hidden; }
    body { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; color: var(--text); }
    html.glass body { background: #0a1433; border: none; color: var(--lg-text); }
    #wallpaper { display: none; }
    html.glass #wallpaper { display: block; position: fixed; inset: -40px; filter: blur(28px) saturate(1.6); pointer-events: none; }
    html.glass #sheet { position: fixed; inset: 0; background: var(--lg-gloss), color-mix(in srgb, var(--lg-menu-bg) 90%, transparent); box-shadow: var(--lg-edge); pointer-events: none; }
    #shell { position: relative; height: 100%; display: flex; flex-direction: column; }
    #search-wrap { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--border); }
    html.glass #search-wrap { border-color: rgba(255, 255, 255, 0.12); }
    #search-wrap svg { opacity: 0.6; flex-shrink: 0; }
    #q { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: inherit; font: inherit; font-size: 14px; }
    #count { font-size: 11px; opacity: 0.5; white-space: nowrap; }
    #list { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 6px 8px; scrollbar-width: thin; }
    .section { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.5; padding: 10px 10px 4px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 9px; cursor: default; }
    .row.focused, .row:hover { background: var(--surface-hover); }
    html.glass .row.focused, html.glass .row:hover { background: rgba(255, 255, 255, 0.1); }
    .fav { width: 18px; height: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 5px; overflow: hidden; font-size: 10px; font-weight: 700; background: color-mix(in srgb, var(--text) 10%, transparent); }
    .fav img { width: 16px; height: 16px; object-fit: contain; }
    .main { flex: 1; min-width: 0; }
    .title { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: 11px; opacity: 0.55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
    .sub .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: inherit; border-radius: 3px; }
    .side { display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 10.5px; opacity: 0.6; }
    .side svg { opacity: 0.8; }
    .close { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; flex-shrink: 0; }
    .row:hover .close, .row.focused .close { opacity: 0.7; }
    .close:hover { opacity: 1; background: var(--surface-hover); color: var(--danger); }
    .row.current .title { font-weight: 650; }
    .row.sleeping .fav { opacity: 0.55; }
    #preview { height: 0; overflow: hidden; transition: height 0.15s ease; border-top: 1px solid transparent; }
    #preview.on { height: 140px; border-top-color: var(--border); }
    #preview img { width: 100%; height: 140px; object-fit: cover; object-position: top; display: block; }
    #empty { padding: 30px 16px; text-align: center; font-size: 12.5px; opacity: 0.55; }
  </style>
</head>
<body>
  <div id="wallpaper" data-wallpaper></div>
  <div id="sheet"></div>
  <div id="shell">
    <div id="search-wrap"><span id="search-icon"></span><input id="q" placeholder="Search your tabs" spellcheck="false" autocomplete="off" /><span id="count"></span></div>
    <div id="list" role="listbox"></div>
    <div id="preview"></div>
  </div>
  <script type="module" src="tabsearch.js"></script>
</body>
</html>
