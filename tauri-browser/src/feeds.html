<!DOCTYPE html>
<html lang="en" data-page="feeds">
<head>
  <meta charset="UTF-8" />
  <title>Feeds</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    /* kessel://feeds (feeds.js): the sites you follow, newest first --
       fetched by Kessel itself, kept on this computer, no account. */
    body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text); }
    #side { width: 260px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--surface); }
    #side h1 { font-size: 17px; margin: 18px 16px 10px; display: flex; align-items: center; gap: 8px; }
    #add { display: flex; gap: 6px; padding: 0 12px 10px; }
    #add input { flex: 1; min-width: 0; }
    #list { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .feed { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 12.5px; cursor: pointer; }
    .feed:hover { background: var(--surface-hover); }
    .feed.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
    .feed .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed .count { font-size: 11px; font-weight: 650; color: var(--accent); }
    .feed .err { color: var(--danger); font-size: 11px; }
    .feed .x { opacity: 0; font-size: 12px; padding: 0 4px; }
    .feed:hover .x { opacity: 0.6; }
    #side-foot { display: flex; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    #head { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-bottom: 1px solid var(--border); }
    #head h2 { font-size: 16px; margin: 0; flex: 1; }
    #items { flex: 1; overflow-y: auto; padding: 8px 16px 60px; }
    .item { display: block; padding: 12px 12px; border-radius: 10px; color: inherit; text-decoration: none; max-width: 820px; }
    .item:hover { background: var(--surface-hover); }
    .item .t { font-size: 14px; font-weight: 600; line-height: 1.35; }
    .item.read .t { font-weight: 400; color: var(--text-dim); }
    .item .m { font-size: 11.5px; color: var(--text-faint); margin: 3px 0 4px; }
    .item .s { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
    .item.read .s { display: none; }
    #empty { padding: 60px 20px; text-align: center; color: var(--text-faint); font-size: 13px; line-height: 1.6; }
    .section { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-faint); padding: 16px 10px 6px; }
    .watched { max-width: 760px; padding: 16px 12px; display: flex; flex-direction: column; gap: 10px; }
    .watched .url { color: var(--accent); font-size: 13px; word-break: break-all; }
    .watched .m { font-size: 12px; color: var(--text-faint); }
    .watched .change { padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .watched .change .s { font-size: 13px; line-height: 1.5; color: var(--text); }
    .watched .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .watched .note { font-size: 11.5px; color: var(--text-faint); line-height: 1.5; margin: 4px 0 0; }
  </style>
</head>
<body>
  <aside id="side">
    <h1 id="title"></h1>
    <form id="add"><input class="field" id="add-url" placeholder="Site or feed address" spellcheck="false" /><button class="btn sm primary">Follow</button></form>
    <div id="list"></div>
    <div id="side-foot">
      <button class="btn sm ghost" id="import">Import OPML…</button>
      <button class="btn sm ghost" id="export">Export OPML</button>
      <input type="file" id="import-file" accept=".opml,.xml,text/xml" hidden />
    </div>
  </aside>
  <main id="main">
    <div id="head"><h2 id="heading">All feeds</h2><button class="btn sm" id="mark-read">Mark all read</button><button class="btn sm" id="refresh">Refresh</button></div>
    <div id="items"></div>
  </main>
  <script type="module" src="feeds.js"></script>
</body>
</html>
