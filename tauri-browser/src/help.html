<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Help</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    body { display: flex; height: 100vh; overflow: hidden; }

    #side {
      width: 220px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 18px 10px;
      overflow-y: auto;
    }
    #side h1 { display: flex; align-items: center; gap: 10px; font-size: 16px; margin: 6px 10px 18px; font-weight: 700; }
    #side h1 svg { color: var(--accent); }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 12.5px;
      color: var(--text-dim);
      text-decoration: none;
    }
    .nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .nav-item.active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }

    main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
    html.reduce-motion main { scroll-behavior: auto; }
    .content { max-width: 760px; margin: 0 auto; padding: 30px 40px 120px; }
    .search { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 4px 0 14px; }
    .search .wrap { position: relative; }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
    .search .field { padding-left: 38px; }

    section { margin-bottom: 38px; scroll-margin-top: 70px; }
    section h2 { font-size: 19px; margin: 18px 0 6px; }
    section > .sub { color: var(--text-faint); font-size: 12.5px; margin: 0 0 16px; line-height: 1.5; }
    h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin: 20px 0 8px; }

    .card { overflow: hidden; }
    .line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 16px;
      font-size: 13px;
    }
    .line + .line { border-top: 1px solid var(--border); }
    .line .what { min-width: 0; }
    .line .what .note { display: block; font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
    .line .keys { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 10px; flex-shrink: 0; }
    .line .keys .alt { color: var(--text-faint); font-size: 11px; }
    .line .keys .none { color: var(--text-faint); font-size: 12px; font-style: italic; }
    .line.custom .what::after { content: "customized"; margin-left: 8px; font-size: 10.5px; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 999px; padding: 1px 7px; }
    kbd {
      display: inline-block;
      min-width: 22px;
      padding: 2px 7px;
      border-radius: 6px;
      border: 1px solid var(--border);
      border-bottom-width: 2px;
      background: var(--surface-2);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      text-align: center;
      color: var(--text);
    }
    .kbd-plus { color: var(--text-faint); margin: 0 3px; font-size: 11px; }
    .combo { white-space: nowrap; }

    .tips { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .tip { padding: 14px 16px; font-size: 12.5px; line-height: 1.5; color: var(--text-dim); }
    .tip b { display: block; color: var(--text); font-size: 13px; margin-bottom: 4px; }
    code { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 5px; color: var(--text); }
    a.page-link { cursor: pointer; }

    .about { display: flex; gap: 18px; align-items: center; padding: 18px; }
    .about .logo { width: 56px; height: 56px; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #fff; background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent)); flex-shrink: 0; }
    .about dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 12.5px; }
    .about dt { color: var(--text-faint); }
    .about dd { margin: 0; overflow-wrap: anywhere; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

    .hidden-by-search { display: none !important; }
    #no-results { display: none; }
    body.searching-empty #no-results { display: block; }

    @media (max-width: 720px) {
      body { flex-direction: column; }
      #side { width: 100%; display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 8px; }
      #side h1 { display: none; }
      .nav-item { flex-shrink: 0; white-space: nowrap; }
      .content { padding: 18px 16px 80px; }
      .line { flex-direction: column; align-items: flex-start; }
      .line .keys { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <aside id="side">
    <h1><span id="logo"></span>Kessel Help</h1>
    <nav id="nav"></nav>
  </aside>
  <main id="main">
    <div class="content">
      <div class="search">
        <div class="wrap">
          <span id="search-icon"></span>
          <input class="field" id="q" type="search" placeholder="Search help and shortcuts" spellcheck="false" autocomplete="off" />
        </div>
      </div>
      <div id="sections"></div>
      <div class="empty" id="no-results">Nothing in Help matches that.</div>
    </div>
  </main>
  <script type="module" src="help.js"></script>
</body>
</html>
