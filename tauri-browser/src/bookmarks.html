<!DOCTYPE html>
<html lang="en" data-page="bookmarks">
<head>
  <meta charset="UTF-8" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    /* kessel://bookmarks (bookmarks.js): the bookmark manager -- folders on
       the left, the bookmarks on the right; search, sort, edit, tag, move,
       import, export, backups, duplicates. */
    body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text); }
    #side { width: 250px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--surface); }
    #side h1 { font-size: 17px; margin: 18px 16px 12px; display: flex; align-items: center; gap: 8px; }
    #tree { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
    .node { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; font-size: 12.5px; cursor: pointer; user-select: none; }
    .node:hover { background: var(--surface-hover); }
    .node.on { background: color-mix(in srgb, var(--accent) 16%, transparent); }
    .node.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
    .node .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .node .n { font-size: 11px; color: var(--text-faint); }
    .node svg { flex-shrink: 0; opacity: 0.75; }
    .section { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); padding: 14px 8px 4px; }
    #side-foot { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-top: 1px solid var(--border); }
    #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    #head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    #head h2 { font-size: 16px; margin: 0 8px 0 0; flex: 1; min-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #q { width: 240px; }
    #bulk { display: none; align-items: center; gap: 8px; padding: 8px 20px; background: color-mix(in srgb, var(--accent) 10%, transparent); border-bottom: 1px solid var(--border); font-size: 12.5px; }
    #bulk.on { display: flex; }
    #list { flex: 1; overflow-y: auto; padding: 6px 12px 60px; }
    .bm { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; }
    .bm:hover { background: var(--surface-hover); }
    .bm.picked { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .bm.dragging { opacity: 0.4; }
    .bm.drop-above { box-shadow: inset 0 2px 0 var(--accent); }
    .bm input[type="checkbox"] { flex-shrink: 0; }
    .bm .fav { width: 18px; height: 18px; flex-shrink: 0; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; background: color-mix(in srgb, var(--text) 10%, transparent); overflow: hidden; }
    .bm .fav img { width: 16px; height: 16px; }
    .bm .main { flex: 1; min-width: 0; cursor: pointer; }
    .bm .t { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bm .u { font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
    .bm .note { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tag { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); cursor: pointer; }
    .bm .acts { display: flex; gap: 2px; opacity: 0; }
    .bm:hover .acts { opacity: 1; }
    .bm .acts button, .icon-btn { width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent; color: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .bm .acts button:hover, .icon-btn:hover { background: var(--surface-hover); }
    #empty { padding: 60px 20px; text-align: center; color: var(--text-faint); font-size: 13px; }
    dialog { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--text); padding: 18px 20px; width: min(480px, 92vw); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45); }
    dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
    dialog h3 { margin: 0 0 12px; font-size: 15px; }
    dialog label { display: block; font-size: 12px; color: var(--text-dim); margin: 10px 0 4px; }
    dialog .field { width: 100%; box-sizing: border-box; }
    dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    dialog .list { max-height: 50vh; overflow-y: auto; }
    .dup { padding: 8px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
    .dup:first-child { border-top: none; }
    .dup .item { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
    .dup .item span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <aside id="side">
    <h1 id="title"></h1>
    <div id="tree"></div>
    <div id="side-foot">
      <button class="btn sm" id="new-folder">New folder</button>
      <button class="btn sm ghost" id="import">Import…</button>
      <button class="btn sm ghost" id="export">Export…</button>
      <button class="btn sm ghost" id="backups">Backups</button>
      <button class="btn sm ghost" id="dups">Find duplicates</button>
    </div>
  </aside>
  <main id="main">
    <div id="head">
      <h2 id="heading">All bookmarks</h2>
      <input class="field" id="q" placeholder="Search titles, addresses, tags, notes" spellcheck="false" />
      <select class="field" id="sort" style="width:140px">
        <option value="manual">Your order</option>
        <option value="name">By name</option>
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
        <option value="site">By site</option>
      </select>
      <button class="btn sm primary" id="add">Add</button>
    </div>
    <div id="bulk"><span id="bulk-count"></span><button class="btn sm" id="bulk-open">Open all</button><button class="btn sm" id="bulk-move">Move to…</button><button class="btn sm" id="bulk-tag">Add a tag…</button><button class="btn sm danger" id="bulk-delete">Delete</button><button class="btn sm ghost" id="bulk-clear">Clear selection</button></div>
    <div id="list"></div>
  </main>

  <dialog id="edit">
    <h3 id="edit-title">Edit bookmark</h3>
    <label for="e-title">Name</label><input class="field" id="e-title" />
    <label for="e-url">Address</label><input class="field mono" id="e-url" spellcheck="false" />
    <label for="e-folder">Folder</label><input class="field" id="e-folder" list="folder-list" placeholder="(top)" />
    <label for="e-tags">Tags, separated by commas</label><input class="field" id="e-tags" placeholder="recipes, weekend" />
    <label for="e-note">Note</label><textarea class="field" id="e-note" rows="3" style="resize:vertical"></textarea>
    <div class="row"><button class="btn sm" id="e-cancel">Cancel</button><button class="btn sm primary" id="e-save">Save</button></div>
  </dialog>
  <dialog id="ask">
    <h3 id="ask-title"></h3>
    <input class="field" id="ask-input" list="folder-list" />
    <div class="row"><button class="btn sm" id="ask-cancel">Cancel</button><button class="btn sm primary" id="ask-ok">OK</button></div>
  </dialog>
  <dialog id="info">
    <h3 id="info-title"></h3>
    <div class="list" id="info-list"></div>
    <div class="row"><button class="btn sm" id="info-close">Close</button></div>
  </dialog>
  <datalist id="folder-list"></datalist>
  <script type="module" src="bookmarks.js"></script>
</body>
</html>
