<!DOCTYPE html>
<html lang="en" data-page="bookmarks">
<head>
  <meta charset="UTF-8" />
  <title>Bookmarks</title>
  <link rel="stylesheet" href="shared/theme.css" />
  <style>
    /* The bookmark manager (kessel://bookmarks, bookmarks.js): folders on
       the left, what's in one (or what you searched for) on the right. */
    body { display: flex; height: 100vh; overflow: hidden; }

    #side { width: 250px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
    #side h1 { font-size: 16px; margin: 6px 10px 14px; font-weight: 700; }
    .nav-item { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 9px; font-size: 12.5px; color: var(--text-dim); cursor: pointer; border: none; background: none; text-align: left; width: 100%; min-height: 32px; }
    .nav-item:hover { background: var(--surface-hover); color: var(--text); }
    .nav-item.active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-weight: 600; }
    .nav-item.drop { outline: 2px dashed var(--accent); outline-offset: -2px; }
    .nav-item .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-item .count { font-size: 11px; color: var(--text-faint); }
    .nav-item .twist { width: 14px; height: 14px; display: flex; align-items: center; justify-content: center; opacity: 0.7; flex-shrink: 0; transition: transform var(--dur) var(--ease); }
    .nav-item .twist.open { transform: rotate(90deg); }
    .nav-item .twist.none { visibility: hidden; }
    .side-title { font-size: 11px; font-weight: 600; color: var(--text-faint); margin: 16px 10px 4px; text-transform: uppercase; letter-spacing: 0.04em; }

    main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    header { padding: 20px 28px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); }
    .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .search { position: relative; flex: 1; min-width: 220px; max-width: 560px; }
    .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; }
    .search .field { padding-left: 38px; }
    .crumbs { font-size: 13px; color: var(--text-dim); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-height: 20px; }
    .crumbs button { border: none; background: none; color: inherit; cursor: pointer; padding: 2px 4px; border-radius: 6px; font: inherit; }
    .crumbs button:hover { background: var(--surface-hover); color: var(--text); }
    .crumbs .here { color: var(--text); font-weight: 600; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

    #bar { padding: 0 28px; }
    .bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px 12px; border-radius: 10px; font-size: 12.5px; background: color-mix(in srgb, var(--accent) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); }
    .bar[hidden] { display: none; }
    .bar .grow { flex: 1; }

    #scroller { flex: 1; overflow-y: auto; padding: 10px 28px 60px; }
    #list { max-width: 980px; }
    .row { display: flex; align-items: center; gap: 12px; padding: 6px 10px; border-radius: 9px; font-size: 13px; min-height: 40px; cursor: default; }
    .row:hover { background: var(--surface-hover); }
    .row.selected { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
    .row.drop-into { outline: 2px dashed var(--accent); outline-offset: -2px; }
    .row .app-icon, .row .folder-icon { width: 20px; height: 20px; flex-shrink: 0; }
    .row .folder-icon { display: flex; align-items: center; justify-content: center; color: var(--accent); }
    .row .text { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: 2px; }
    .row .title { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .sub { color: var(--text-faint); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .note { color: var(--text-dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); cursor: pointer; border: none; }
    .row .row-btn { opacity: 0; flex-shrink: 0; }
    .row:hover .row-btn, .row .row-btn:focus-visible { opacity: 1; }
    .row .state { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); white-space: nowrap; }

    /* Cards: the preview pictures. */
    body.cards #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    body.cards .row { flex-direction: column; align-items: stretch; padding: 0 0 10px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; gap: 8px; min-height: 0; }
    body.cards .row .preview { height: 124px; background: var(--surface-2) center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--text-faint); }
    body.cards .row .line { display: flex; gap: 8px; align-items: center; padding: 0 10px; }
    body.cards .row .row-btn { opacity: 1; }
    .row .preview { display: none; }
    .row .line { display: contents; }

    .menu { position: fixed; min-width: 220px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 5px; z-index: 50; animation: popIn var(--dur) var(--ease); max-height: 70vh; overflow-y: auto; }
    .menu button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: none; background: none; border-radius: 8px; font-size: 12.5px; cursor: pointer; text-align: left; }
    .menu button:hover, .menu button:focus-visible { background: var(--surface-hover); outline: none; }
    .menu button.danger { color: var(--danger); }
    .menu hr { border: none; border-top: 1px solid var(--border); margin: 4px 2px; }

    .empty-state { text-align: center; color: var(--text-faint); padding: 70px 20px; font-size: 13px; }
    .empty-state svg { display: block; margin: 0 auto 12px; opacity: 0.6; }
    .section-title { font-size: 12px; font-weight: 600; color: var(--text-dim); margin: 20px 10px 6px; }
    .group { border: 1px solid var(--border); border-radius: 12px; padding: 6px; margin: 10px 0; }

    .form { display: grid; grid-template-columns: 90px 1fr; gap: 10px 12px; align-items: center; font-size: 12.5px; }
    .form textarea { resize: vertical; min-height: 60px; }

    @media (max-width: 720px) {
      body { flex-direction: column; }
      #side { width: auto; max-height: 38vh; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <nav id="side">
    <h1>Bookmarks</h1>
    <div id="tree"></div>
    <div class="side-title">Tidy up</div>
    <button class="nav-item" data-view="duplicates"></button>
    <button class="nav-item" data-view="links"></button>
    <button class="nav-item" data-view="backups"></button>
  </nav>
  <main>
    <header>
      <div class="top">
        <div class="search"><span id="search-icon"></span><input class="field" id="q" placeholder="Search bookmarks -- or #tag" spellcheck="false" autocomplete="off" /></div>
        <div class="actions">
          <button class="btn sm" id="add-btn"></button>
          <button class="btn sm" id="folder-btn"></button>
          <button class="btn sm" id="sort-btn"></button>
          <button class="btn sm icon-only" id="view-btn"></button>
          <button class="btn sm icon-only" id="more-btn"></button>
        </div>
      </div>
      <div class="crumbs" id="crumbs"></div>
    </header>
    <div id="bar"><div class="bar" id="selection" hidden><span class="grow" id="selection-text"></span><button class="btn sm" id="move-selected"></button><button class="btn sm danger" id="delete-selected"></button><button class="btn sm ghost" id="clear-selection">Cancel</button></div></div>
    <div id="scroller"><div id="list"></div></div>
  </main>
  <script type="module" src="bookmarks.js"></script>
</body>
</html>
